name: Fix secure modifiers and build

on:
  push:
    branches:
      - feature/callout-tether-preview

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/callout-tether-preview

      - name: Fix secure modifier condition syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '[mod:alt,ctrl,shift] alt-ctrl-shift-; [mod:alt,ctrl] alt-ctrl-; [mod:alt,shift] alt-shift-; [mod:ctrl,shift] ctrl-shift-; [mod:alt] alt-; [mod:ctrl] ctrl-; [mod:shift] shift-; [] none'
          new = '[mod:alt,mod:ctrl,mod:shift] alt-ctrl-shift-; [mod:alt,mod:ctrl] alt-ctrl-; [mod:alt,mod:shift] alt-shift-; [mod:ctrl,mod:shift] ctrl-shift-; [mod:alt] alt-; [mod:ctrl] ctrl-; [mod:shift] shift-; [] none'

          paths = [
              Path('Objectives/Callouts.lua'),
              Path('Objectives/CalloutDragPolicy.lua'),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')
              print(f'{path}: replaced {count}')
              total += count
          if total < 4:
              raise SystemExit(f'Expected at least 4 modifier parser replacements, found {total}')
          PY

          if grep -R -nE '\[mod:[^]]*,(ctrl|shift|alt)(,|])' Objectives/Callouts.lua Objectives/CalloutDragPolicy.lua; then
            echo 'Invalid shorthand modifier condition remains.' >&2
            exit 1
          fi

      - name: Validate Lua 5.1 syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          LUAC="$(command -v luac5.1 || command -v luac)"
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 "$LUAC" -p

      - name: Commit parser fix to feature branch
        run: |
          if git diff --quiet -- Objectives/Callouts.lua Objectives/CalloutDragPolicy.lua; then
            echo 'No parser changes to commit.'
          else
            git config user.name 'BattleMaps Build'
            git config user.email 'actions@users.noreply.github.com'
            git add Objectives/Callouts.lua Objectives/CalloutDragPolicy.lua
            git commit -m 'Fix secure modifier condition parsing'
            git push origin HEAD:feature/callout-tether-preview
          fi

      - name: Build clean addon archive
        run: |
          python3 .github/scripts/build_release.py --version 3.1.0 --output test-release
          mv test-release/BattleMaps-3.1.0.zip test-release/BattleMaps-3.1.0-secure-modifier-fix.zip
          unzip -t test-release/BattleMaps-3.1.0-secure-modifier-fix.zip

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: BattleMaps-secure-modifier-fix
          path: test-release/BattleMaps-3.1.0-secure-modifier-fix.zip
          if-no-files-found: error
          retention-days: 7
